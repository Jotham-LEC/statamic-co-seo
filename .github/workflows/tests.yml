name: Tests

on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: PHP ${{ matrix.php }} · ${{ matrix.statamic }} · ${{ matrix.db }}${{ !matrix.imagick && ' · no imagick' || '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest PHP and Statamic composer.json allows, on Laravel 12 (12.69
          # is its first release without a security advisory, which Composer
          # won't install). Not --prefer-lowest across the board: the lowest
          # Guzzle doesn't load with Laravel 12.
          - { php: '8.3', statamic: '6.34.0', laravel: '^12.69', db: sqlite, imagick: true }
          - { php: '8.4', statamic: latest, db: sqlite, imagick: true }
          - { php: '8.4', statamic: latest, db: pgsql, imagick: true }
          # Favicons drawn with GD; the share-card tests skip.
          - { php: '8.4', statamic: latest, db: sqlite, imagick: false }

    services:
      postgres:
        image: ${{ matrix.db == 'pgsql' && 'postgres:16' || '' }}
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mt_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, dom, gd, mbstring, openssl, pdo_sqlite, pdo_pgsql, ${{ matrix.imagick && 'imagick' || ':imagick' }}
          coverage: none

      - name: Pin Statamic ${{ matrix.statamic }} and Laravel ${{ matrix.laravel }}
        if: matrix.statamic != 'latest'
        run: composer require --no-update --no-interaction "statamic/cms:${{ matrix.statamic }}" "laravel/framework:${{ matrix.laravel }}"

      - uses: ramsey/composer-install@v3

      # One Postgres database, so that run is serial.
      - name: Tests
        run: vendor/bin/pest --display-warnings --fail-on-warning ${{ matrix.db == 'sqlite' && '--parallel' || '' }}
        env:
          MT_TEST_DB: ${{ matrix.db == 'pgsql' && 'pgsql' || '' }}
          DB_USERNAME: postgres
          DB_PASSWORD: postgres

      # The redirect suites again, with rules in files rather than the database.
      - name: Tests (redirects in files)
        run: vendor/bin/pest --display-warnings --fail-on-warning --group=redirects ${{ matrix.db == 'sqlite' && '--parallel' || '' }}
        env:
          MT_TEST_REDIRECTS: file
          MT_TEST_DB: ${{ matrix.db == 'pgsql' && 'pgsql' || '' }}
          DB_USERNAME: postgres
          DB_PASSWORD: postgres

  quality:
    name: Pint, PHPStan, built assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl, dom, gd, imagick, mbstring, openssl
          coverage: none

      - run: composer validate --strict --no-check-lock

      - uses: ramsey/composer-install@v3

      - run: composer lint
      - run: composer analyse

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The source compiles, and the committed manifest names files that are
      # there. (Not a byte-for-byte comparison: the bundle embeds the export
      # list of whichever Statamic is installed, so it changes with Statamic.)
      - run: npm ci && npx vite build --outDir /tmp/build
      # The front-end toolbar: it compiles, the committed copy is there, and it stays within its budget.
      - run: npx vite build --config vite.toolbar.config.js --outDir /tmp/build-toolbar
      - run: test -f resources/dist/build/toolbar.js
      - run: |
          size=$(gzip -9c /tmp/build-toolbar/toolbar.js | wc -c)
          echo "toolbar.js: $size bytes gzipped"
          test "$size" -le 15360
      - run: php -r 'foreach (json_decode(file_get_contents("resources/dist/build/manifest.json"), true) as $e) { foreach ([$e["file"], ...($e["css"] ?? [])] as $f) { if (! is_file("resources/dist/build/$f")) { fwrite(STDERR, "missing $f\n"); exit(1); } } }'
